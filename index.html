<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <script src="https://code.jquery.com/jquery-3.7.1.js"></script> -->
    <title>Custom Alert Popup Box using</title>
    <!-- Font Awesome Link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <!-- Stye link -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a href="#" class="click">Click Me</a>

    <div class="popup_box">
      <div class="icon-container">
        <i class="fa-solid fa-exclamation"></i>
      </div>
      <h1>Your account will be deleted Permanently!</h1>
      <label>Are you sure to proceed?</label>
      <div class="btns">
        <a href="#" class="btn1">Cancel Process</a>
        <a href="#" class="btn2">Delete Account</a>
      </div>
    </div>

    <div class="atom_box">
      <div class="atom-content">
        <span>Atom</span>
        <i class="fa-solid fa-xmark"></i>
      </div>
      <p>Your Account Deleted Successfully.</p>
      <div class="atom-btn">
        <button class="btn3">OK</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
